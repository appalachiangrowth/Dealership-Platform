# Happy Motors — /etc/nginx/sites-available/happymotors1.com
#   https://happymotors1.com, https://www.happymotors1.com  → happymotors-site  (127.0.0.1:3005)
#   https://happymotors1.com/admin (and www…/admin)          → happymotors-admin (127.0.0.1:3006, Next basePath /admin)
# certbot --nginx adds the 443 / SSL part and the http → https redirect.
server {
    listen 80;
    listen [::]:80;
    server_name happymotors1.com www.happymotors1.com;

    client_max_body_size 50m;

    # FB Poster live view (WebSocket). The portal's /admin/api path is a Next.js proxy, which cannot carry
    # WebSockets: this one path goes straight to the API. (Not needed with an https:// NEXT_PUBLIC_API_URL.)
    location = /admin/api/dealer/facebook/view/ws {
        proxy_pass http://127.0.0.1:4000/dealer/facebook/view/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;           # the API pings every 25 s; this only ends a dead connection
        proxy_send_timeout 3600s;
    }

    # Dealer Portal (keeps the /admin prefix: the app is built with basePath '/admin')
    location ^~ /admin {
        client_max_body_size 600m;          # vehicle photos / videos go through the portal's /admin/api proxy
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # Public website
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }
}
