# Nginx for the Dealer Platform — copy to /etc/nginx/sites-available/dealer-platform, replace yourcompany.com,
# link it into sites-enabled, `nginx -t && systemctl reload nginx`, then run certbot (see DEPLOY-CONTABO.md).

# shared proxy settings
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# ---------- API (backend :4000) ----------
server {
  listen 80;
  server_name api.yourcompany.com;
  client_max_body_size 600m;            # FB Poster videos / photo uploads
  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 180s;            # live-view pictures wait up to 8 s; Facebook steps can take longer
    proxy_send_timeout 600s;
    proxy_request_buffering off;        # big uploads stream straight to the API
  }
}

# ---------- Dealership Portal (:3000) ----------
server {
  listen 80;
  server_name portal.yourcompany.com;
  client_max_body_size 50m;
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

# ---------- Platform Admin (:3001) ----------
server {
  listen 80;
  server_name admin.yourcompany.com;
  client_max_body_size 100m;            # theme ZIP uploads
  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

# ---------- every dealer website (any other domain → :3002) ----------
# Dealers point their domain (A record) at this server; the website app finds the dealer by the domain.
# Sub-domains for dealers without their own domain: *.sites.yourcompany.com (wildcard DNS record).
server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 20m;
  location / {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;        # the website app needs the dealer's domain
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
